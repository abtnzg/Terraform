apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8simagetag
  annotations:
    description: "Container images must not use the :latest tag or no tag at all"
spec:
  crd:
    spec:
      names:
        kind: K8sImageTag
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8simagetag

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          tag := split(container.image, ":")[1]
          tag == "latest"
          msg := sprintf("container %q uses :latest tag", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not contains(container.image, ":")
          msg := sprintf("container %q has no image tag (implicit :latest)", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          digest := split(container.image, "@")[1]
          digest == ""
          msg := sprintf("container %q has no image tag (digest only)", [container.name])
        }
