# ============================================================================
# Kyverno: Pod Security Standards — BASELINE
# ----------------------------------------------------------------------------
# Maps to https://kubernetes.io/docs/concepts/security/pod-security-standards/
# Baseline is the minimum that prevents known privilege escalations. Enforce
# everywhere except kube-system + the policy controllers themselves.
# Validation only — mutations are in 90-mutations-defaults.yaml.
# ============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: psa-baseline
  annotations:
    policies.kyverno.io/title: Pod Security Standards — Baseline
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Enforce the Kubernetes Pod Security Standard "baseline" profile across
      all namespaces. Blocks hostPath, hostNetwork, hostPID, hostIPC, host
      ports, hostProcess containers, privileged containers, capabilities
      beyond the safe set, /proc mount, unsafe sysctls, and SELinux/AppArmor
      type overrides.
spec:
  validationFailureAction: {{ if eq .Environment.Values.environment "prod" }}Enforce{{ else }}Audit{{ end }}
  background: true
  rules:
    - name: baseline
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE, UPDATE]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - gatekeeper-system
                - kyverno
                - envoy-gateway-system
      validate:
        podSecurity:
          level: baseline
          version: latest
