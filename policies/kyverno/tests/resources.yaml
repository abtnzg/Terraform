# --- 40 — storage policies --------------------------------------------------

# 40.a — PVC missing storageClassName (fail require-storageclass)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-no-sc
  namespace: team-alpha
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

# 40.b — PVC on unapproved storage class (fail restrict-storageclass)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-gp2
  namespace: team-alpha
spec:
  storageClassName: gp2
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

# 40.c — PVC on approved storage class with right access mode (pass)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-gp3
  namespace: team-alpha
spec:
  storageClassName: gp3-encrypted
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

# 40.d — EFS PVC requesting ReadWriteOnce (fail efs-rwx-only)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-efs-rwo
  namespace: team-alpha
spec:
  storageClassName: efs-shared
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

# 40.e — EFS PVC with ReadWriteMany (pass)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-efs-rwx
  namespace: team-alpha
spec:
  storageClassName: efs-shared
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi

