# --- 20 — restrict service types --------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: svc-nodeport
  namespace: team-alpha
spec:
  type: NodePort
  selector:
    app: foo
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: svc-clusterip
  namespace: team-alpha
spec:
  type: ClusterIP
  selector:
    app: foo
  ports:
    - port: 80
      targetPort: 8080

# --- 21 — required labels ----------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-no-labels
  namespace: team-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foo
  template:
    metadata:
      labels:
        app: foo
    spec:
      containers:
        - name: app
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/app:v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-with-labels
  namespace: team-alpha
  labels:
    app.kubernetes.io/name: foo
    app.kubernetes.io/part-of: team-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foo
  template:
    metadata:
      labels:
        app: foo
        app.kubernetes.io/name: foo
        app.kubernetes.io/part-of: team-alpha
    spec:
      containers:
        - name: app
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/app:v1

# --- 30 — block cluster-admin ------------------------------------------------
---
