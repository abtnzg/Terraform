# --- 10 — requests/limits ----------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-requests
  namespace: team-alpha
spec:
  containers:
    - name: app
      image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/app:v1
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-requests
  namespace: team-alpha
spec:
  containers:
    - name: app
      image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/app:v1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi

